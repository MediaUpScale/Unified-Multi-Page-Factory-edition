# -----------------------------------------------------------------------------
# Visual themes. `--theme` / `render.theme` picks one of these palettes.
# -----------------------------------------------------------------------------
themes:
  classic_terminal:
    background: "#131314"
    chrome: "#1E1E20"
    orchestrator: "#00FF66"
    target: "#FFAA00"
    dim: "#9AA0A6"
  cyberpunk:
    background: "#0D0B18"
    chrome: "#1A1528"
    orchestrator: "#FF007F"
    target: "#00E5FF"
    dim: "#6B5A8A"

# -----------------------------------------------------------------------------
# Renderer — dark cinematic terminal UI with a rolling chat transcript.
# -----------------------------------------------------------------------------
render:
  enabled: true
  width: 1080
  height: 1920
  fps: 24
  # Downscale everything for fast iteration (0.5 => 540x960). 1.0 = final.
  preview_scale: 1.0
  # 44 is the largest size at which a full 400-char utterance (the guardrail
  # ceiling) still fits the body region at 1080x1920 without tightening leading.
  # Raise it only if you also lower guardrails.max_output_chars.
  font_size: 44
  theme: classic_terminal
  # Finished turns that stay on screen above the live line, dimmed.
  history_turns: 3
  history_opacity: 0.40
  # Fraction of each segment spent holding the completed line (rest is typing).
  typing_hold_ratio: 0.18
  # Masked chat viewport: ease-in-out Y-scroll when a new turn would overflow.
  scroll_s: 1.0
  # Empty beat before the first line types.
  preroll_s: 1.0
  # Hold after a sent question before the incoming response starts.
  reply_gap_s: 1.0
  # Flash on the send arrow after typing completes.
  send_flash_s: 0.2
  # Monospace lookup order; first hit wins, PIL default is the last resort.
  font_candidates:
    - C:/Windows/Fonts/consola.ttf
    - C:/Windows/Fonts/CascadiaMono.ttf
    - /usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf
  # Legacy fallback if `themes` is missing the selected name.
  palette:
    background: "#131314"
    chrome: "#1E1E20"
    orchestrator: "#00FF66"
    target: "#FFAA00"
    dim: "#9AA0A6"
  codec: libx264
  crf: 20
  preset: medium

# -----------------------------------------------------------------------------
# VFX hook chain (media/vfx.py). Stubs are registered but inert until enabled,
# so you can drop in WMP-style visualizers / CRT scanlines later without
# touching the renderer.
# -----------------------------------------------------------------------------
vfx:
  chain:
    - name: crt_scanlines
      enabled: false
      params: { intensity: 0.12, line_spacing: 3 }
    - name: audio_visualizer
      enabled: false
      params: { bars: 48, height_px: 180, anchor: bottom }
    - name: vignette
      enabled: false
      params: { strength: 0.35 }

# -----------------------------------------------------------------------------
# Output routing. Aiwake prefers the parent engine's global outputs/ dir and
# silently degrades to a module-local folder when extracted standalone.
# -----------------------------------------------------------------------------
paths:
  channel_slug: aiwake
  prefer_global_outputs: true
  local_outputs_dirname: _local_outputs
